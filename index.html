<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>乐队官方网站</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", sans-serif;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: #f7f9fc;
            color: #111111;
            line-height: 1.7;
            background-image: radial-gradient(rgba(127, 218, 255, 0.18) 0.5px, transparent 0.5px);
            background-size: 22px 22px;
        }

        /* 导航栏 */
        nav {
            position: fixed;
            top: 0;
            width: 100%;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(10px);
            padding: 1.2rem 0;
            z-index: 99;
            border-bottom: 1px solid rgba(127, 218, 255, 0.35);
        }

        .nav-wrap {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
        }

        .logo-text {
            font-size: 24px;
            font-weight: bold;
            color: #111111;
            letter-spacing: 2px;
        }

        .nav-links {
            display: flex;
            gap: 4rem;
        }

        .nav-links a {
            color: #222222;
            text-decoration: none;
            font-size: 18px;
            position: relative;
            transition: color 0.3s;
        }

        .nav-links a::after {
            content: "";
            position: absolute;
            width: 0;
            height: 2px;
            bottom: -4px;
            left: 0;
            background: #7FDAFF;
            transition: 0.3s;
        }

        .nav-links a:hover {
            color: #1da1f2;
        }

        .nav-links a:hover::after {
            width: 100%;
        }

        main {
            max-width: 1200px;
            margin: 0 auto;
            padding-top: 100px;
        }

        section {
            padding: 100px 20px;
        }

        section h2 {
            text-align: center;
            font-size: 36px;
            margin-bottom: 50px;
            color: #111111;
            letter-spacing: 3px;
            position: relative;
        }

        section h2 span {
            color: #1da1f2;
        }

        /* 关于我们 */
        .about-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
            align-items: center;
        }

        .about-text textarea {
            width: 100%;
            min-height: 340px;
            background: #ffffff;
            border: 1px solid rgba(127, 218, 255, 0.45);
            border-radius: 12px;
            color: #111111;
            padding: 1.5rem;
            font-size: 16px;
            resize: vertical;
            outline: none;
            transition: border 0.3s, box-shadow 0.3s;
        }

        .about-text textarea:focus {
            border-color: #1da1f2;
            box-shadow: 0 0 0 4px rgba(127, 218, 255, 0.25);
        }

        .band-photo-box {
            cursor: pointer;
            overflow: hidden;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(29, 161, 242, 0.25);
        }

        .band-photo-box img {
            width: 100%;
            display: block;
            transition: transform 0.4s ease;
        }

        .band-photo-box:hover img {
            transform: scale(1.04);
        }

        /* 成员介绍 */
        .member-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 32px;
        }

        .member-card {
            background: #ffffff;
            border-radius: 14px;
            overflow: hidden;
            text-align: center;
            padding-bottom: 24px;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
            transition: all 0.3s ease;
            border: 1px solid rgba(127, 218, 255, 0.3);
        }

        .member-card:hover {
            transform: translateY(-8px);
            border-color: #7FDAFF;
            box-shadow: 0 14px 30px rgba(127, 218, 255, 0.35);
        }

        .member-card .photo-area {
            height: 280px;
            background: #eaf6ff;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #4fa8d8;
            font-size: 18px;
        }

        .member-card .photo-area img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .member-card h3 {
            margin-top: 18px;
            font-size: 20px;
            color: #111111;
        }

        .member-card p {
            color: #555555;
            font-size: 15px;
            margin-top: 4px;
        }

        /* 近期活动 */
        .event-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 26px;
        }

        .event-card {
            background: #ffffff;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(127, 218, 255, 0.3);
            transition: all 0.3s ease;
        }

        .event-card:hover {
            transform: translateY(-6px) scale(1.02);
            border-color: #7FDAFF;
            box-shadow: 0 14px 30px rgba(127, 218, 255, 0.35);
        }

        .event-card .poster-area {
            height: 380px;
            background: #eaf6ff;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #4fa8d8;
            font-size: 18px;
            cursor: pointer;
            overflow: hidden;
        }

        .event-card .poster-area img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition: transform 0.4s ease;
        }

        .event-card .poster-area:hover img {
            transform: scale(1.04);
        }

        /* 图片放大弹窗 */
        .img-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 18, 30, 0.9);
            z-index: 999;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .img-modal.active {
            display: flex;
            opacity: 1;
        }

        .img-modal img {
            max-width: 90%;
            max-height: 90vh;
            border-radius: 6px;
            box-shadow: 0 10px 40px rgba(127, 218, 255, 0.45);
        }

        .img-modal .close {
            position: absolute;
            top: 30px;
            right: 40px;
            color: #fff;
            font-size: 48px;
            cursor: pointer;
            transition: color 0.2s;
        }

        .img-modal .close:hover {
            color: #7FDAFF;
        }

        /* 移动端适配 */
        @media (max-width: 900px) {
            .nav-links {
                gap: 2rem;
            }

            .about-container {
                grid-template-columns: 1fr;
            }

            .member-grid {
                grid-template-columns: repeat(2, 1fr);
            }

            .event-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 580px) {
            .nav-wrap {
                flex-direction: column;
                gap: 12px;
            }

            .member-grid,
            .event-grid {
                grid-template-columns: 1fr;
            }

            section h2 {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>

    <!-- 导航栏 -->
    <nav>
        <div class="nav-wrap">
            <div class="logo-text">BAND NAME</div>
            <div class="nav-links">
                <a href="#about">关于我们</a>
                <a href="#member">成员介绍</a>
                <a href="#event">近期活动</a>
            </div>
        </div>
    </nav>

    <main>

        <!-- 关于我们 -->
        <section id="about">
            <h2>关于<span>我们</span></h2>
            <div class="about-container">
                <div class="about-text">
                    <textarea placeholder="在这里填写乐队介绍、故事、风格简介等文字内容...">
我们是一支独立乐队，热爱摇滚/流行音乐，专注现场演出，用音乐表达态度。
成立于XXXX年，多次在各地livehouse演出。
                    </textarea>
                </div>

                <div class="band-photo-box" onclick="openModal('band-group.jpg')">
                    <img src="band-group.jpg" alt="乐队合照">
                </div>
            </div>
        </section>

        <!-- 成员介绍 -->
        <section id="member">
            <h2>成员<span>介绍</span></h2>
            <div class="member-grid">

                <div class="member-card">
                    <div class="photo-area">成员照片位置</div>
                    <h3>主唱</h3>
                    <p>名字</p>
                </div>

                <div class="member-card">
                    <div class="photo-area">成员照片位置</div>
                    <h3>主音吉他</h3>
                    <p>名字</p>
                </div>

                <div class="member-card">
                    <div class="photo-area">成员照片位置</div>
                    <h3>贝斯手</h3>
                    <p>名字</p>
                </div>

                <div class="member-card">
                    <div class="photo-area">成员照片位置</div>
                    <h3>鼓手</h3>
                    <p>名字</p>
                </div>

                <div class="member-card">
                    <div class="photo-area">成员照片位置</div>
                    <h3>键盘手</h3>
                    <p>名字</p>
                </div>

                <div class="member-card">
                    <div class="photo-area">成员照片位置</div>
                    <h3>节奏吉他</h3>
                    <p>名字</p>
                </div>

            </div>
        </section>

        <!-- 近期活动 -->
        <section id="event">
            <h2>近期<span>活动</span></h2>
            <div class="event-grid">

                <div class="event-card">
                    <div class="poster-area" onclick="openModal('poster1.jpg')">
                        <img src="poster1.jpg" alt="活动海报1">
                    </div>
                </div>

                <div class="event-card">
                    <div class="poster-area" onclick="openModal('poster2.jpg')">
                        <img src="poster2.jpg" alt="活动海报2">
                    </div>
                </div>

                <div class="event-card">
                    <div class="poster-area" onclick="openModal('poster3.jpg')">
                        <img src="poster3.jpg" alt="活动海报3">
                    </div>
                </div>

                <div class="event-card">
                    <div class="poster-area" onclick="openModal('poster4.jpg')">
                        <img src="poster4.jpg" alt="活动海报4">
                    </div>
                </div>

            </div>
        </section>

    </main>

    <!-- 图片放大弹窗 -->
    <div class="img-modal" id="modal">
        <span class="close" onclick="closeModal()">×</span>
        <img id="modal-img" src="" alt="放大图片">
    </div>

    <script>
        const modal = document.getElementById("modal");
        const modalImg = document.getElementById("modal-img");

        function openModal(src) {
            modalImg.src = src;
            modal.classList.add("active");
            document.body.style.overflow = "hidden";
        }

        function closeModal() {
            modal.classList.remove("active");
            document.body.style.overflow = "";
        }

        modal.addEventListener("click", function (e) {
            if (e.target === modal) {
                closeModal();
            }
        });

        document.addEventListener("keydown", function (e) {
            if (e.key === "Escape") {
                closeModal();
            }
        });
    </script>

</body>
</html>
